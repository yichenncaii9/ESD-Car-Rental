apiVersion: apps/v1
kind: Deployment
metadata:
  name: twilio-worker
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: twilio-worker
  template:
    metadata:
      labels:
        app: twilio-worker
    spec:
      containers:
        - name: twilio-worker
          image: esd-twilio-worker:latest
          imagePullPolicy: Never
          env:
            - name: RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: common-config
                  key: RABBITMQ_HOST
            - name: RABBITMQ_PORT
              valueFrom:
                configMapKeyRef:
                  name: common-config
                  key: RABBITMQ_PORT
            - name: WEBSOCKET_SERVER_URL
              valueFrom:
                configMapKeyRef:
                  name: common-config
                  key: WEBSOCKET_SERVER_URL
          # No ports — AMQP consumer only
          # No livenessProbe — pika retry self-heals on RabbitMQ startup
